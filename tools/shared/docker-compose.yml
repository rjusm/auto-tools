# Запуск из tools/shared (общий бот/моки для slow-query-fix и incident-triage):
#   docker compose run --rm tests                              # тесты (мок Telegram + моки git/Jira)
#   docker compose run --rm bot notify "проверка"              # настоящий бот, токен из .env.local
#   docker compose run --rm bot gate "Продолжаем?" --timeout 120
name: shared-tools
services:
  mock-telegram:
    build: .
    command: ["python", "-I", "mock_telegram.py", "8081"]
  tests:
    build: .
    depends_on: [mock-telegram]
    environment:
      MOCK_URL: http://mock-telegram:8081
  bot:
    build: .
    entrypoint: ["python", "-I", "tg_gate.py"]
    env_file:
      - path: .env.local
        required: false
    environment:
      SLOWQUERY_ENV_FILE: /nonexistent
      # если Telegram заблокирован сетью: HTTPS_PROXY=http://host.docker.internal:PORT docker compose run ...
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
